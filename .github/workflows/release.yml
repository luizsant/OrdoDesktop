name: Release

# Ao enviar uma tag vX.Y.Z, gera o .deb e publica a Release com ele anexado.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de build (GTK e renderizador SVG para os ícones)
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 librsvg2-common

      - name: Gerar o pacote
        run: ./build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          files: ordo-desktop_*_all.deb
          generate_release_notes: true
