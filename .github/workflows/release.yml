name: Release

# Ao enviar uma tag vX.Y.Z: gera o .deb (Linux) e o instalador .exe (Windows, já testado numa máquina
# Windows de verdade) e publica a Release com os dois anexados.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas gráficas (o build desenha os ícones com o Qt)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1

      - name: Gerar o pacote .deb
        run: ./build-deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ordo-linux-deb
          path: ordo-desktop_*_amd64.deb

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  publicar:
    needs: [deb, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pacotes/*.deb
            pacotes/*.exe
          generate_release_notes: true
