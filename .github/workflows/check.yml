name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Análise do código
        run: |
          python3 -m pip install -q --break-system-packages pyflakes
          python3 -m pyflakes ordo packaging
          python3 -m compileall -q ordo

      - name: Bibliotecas gráficas (o build desenha os ícones com o Qt)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1

      - name: Gerar o .deb
        run: ./build-deb.sh 0.0.0-ci && dpkg-deb --info ordo-desktop_0.0.0-ci_amd64.deb

      - name: Instalar o .deb e abrir o Ordo numa tela virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./ordo-desktop_0.0.0-ci_amd64.deb
          mkdir -p ~/Desktop/Pasta && touch ~/Desktop/exemplo.pdf ~/Desktop/planilha.xlsx
          ORDO_SELFTEST="$PWD/linux.png;8" xvfb-run -a -s "-screen 0 1600x900x24" ordo-desktop
          cat linux.json
          python3 -c "import json,sys; d=json.load(open('linux.json')); sys.exit(0 if d['items']==3 and d['clock'] else 1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordo-linux-teste
          path: linux.*
